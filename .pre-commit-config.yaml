repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt -- --check
        language: system
        types: [rust]

      - id: cargo-clippy
        name: cargo clippy
        entry: env SQLX_OFFLINE=true cargo clippy --all-targets --
        language: system
        types: [rust]
        pass_filenames: false