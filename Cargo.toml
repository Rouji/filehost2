[package]
name = "filehost2"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
actix-http = "3"

[dependencies]
actix-files = "0.6.10"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
actix-form-data = "0.6.2"
actix-multipart = "0.7.2"
actix-web = { version = "4.0", features = ["rustls"] }
env-settings = "0.1.15"
env-settings-derive = "0.1.15"
env-settings-utils = "0.1.15"
env_logger = "0.11.8"
log = "0.4"
blake3 = "1"
futures-util = "0.3"
mime = "0.3"
tokio = { version = "1", features = ["fs", "io-util"] }
rand = "0.10.0"
time = { version = "0.3", features = ["parsing"] }
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "mysql", "macros", "migrate", "time", "uuid"] }
tempfile = "3"
tinytemplate = "1.2.1"
uuid = { version="1.21.0", features=["v4"] }
mime_guess = "2"
dotenvy = "0.15.7"
